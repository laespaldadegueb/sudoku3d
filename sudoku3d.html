<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8" />
<title>Mockup Sudoku 3D — 4×4×4</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f1220; color: #e6e8ef; font-family: system-ui, sans-serif; overflow: hidden; }
  #ui {
    position: absolute; top: 12px; left: 12px; z-index: 10;
    background: rgba(20, 24, 40, 0.85); padding: 12px 14px; border-radius: 10px;
    max-width: 280px; font-size: 13px; line-height: 1.4;
  }
  #ui h1 { margin: 0 0 6px; font-size: 15px; }
  #ui code { background: #2a2f4a; padding: 1px 5px; border-radius: 4px; }
  #hud {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(20, 24, 40, 0.9); padding: 10px 16px; border-radius: 10px;
    display: flex; gap: 6px; z-index: 10;
  }
  .num {
    width: 34px; height: 34px; border-radius: 6px; border: 1px solid #3a4066;
    background: #1a1f38; color: #e6e8ef; font-size: 16px; cursor: pointer;
  }
  .num:hover { background: #2a3158; }
  .num.clear { background: #4a1f2a; border-color: #7a2a3a; }
  #status { position: absolute; top: 12px; right: 12px; z-index: 10;
    background: rgba(20, 24, 40, 0.85); padding: 8px 12px; border-radius: 8px; font-size: 12px; }
</style>
</head>
<body>
  <div id="ui">
    <h1>Sudoku 3D · 4×4×4</h1>
    <div>Regla: cada <b>fila</b>, <b>columna</b> i <b>pilar</b> ha de contenir 1–4 sense repetir.</div>
    <div style="margin-top:6px; opacity:0.8;">
      · Arrossega per rotar<br />
      · Roda per apropar/allunyar<br />
      · Clica una cel·la buida i escull número
    </div>
  </div>
  <div id="status">Cel·la: —</div>
  <div id="hud">
    <button class="num" data-n="1">1</button>
    <button class="num" data-n="2">2</button>
    <button class="num" data-n="3">3</button>
    <button class="num" data-n="4">4</button>
    <button class="num clear" data-n="0">✕</button>
  </div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const N = 4;
const SPACING = 1.15;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f1220);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(7, 6, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const dir = new THREE.DirectionalLight(0xffffff, 0.9);
dir.position.set(5, 8, 6);
scene.add(dir);

// Puzzle inicial: alguns pistes prefixades (0 = buit)
// Grid[x][y][z]
const grid = Array.from({length:N}, () =>
  Array.from({length:N}, () =>
    Array.from({length:N}, () => 0)));
const fixed = Array.from({length:N}, () =>
  Array.from({length:N}, () =>
    Array.from({length:N}, () => false)));

const clues = [
  [0,0,0,1],[1,1,0,2],[2,2,0,3],[3,3,0,4],
  [0,1,1,3],[1,0,1,4],[2,3,1,1],[3,2,1,2],
  [0,2,2,4],[1,3,2,3],[2,0,2,2],[3,1,2,1],
  [0,3,3,2],[1,2,3,1],[2,1,3,4],[3,0,3,3],
];
for (const [x,y,z,v] of clues) { grid[x][y][z] = v; fixed[x][y][z] = true; }

// Materials
const cellGeom = new THREE.BoxGeometry(0.95, 0.95, 0.95);
const edgeGeom = new THREE.EdgesGeometry(cellGeom);

const matEmpty = new THREE.MeshStandardMaterial({ color: 0x1a2040, transparent:true, opacity:0.25, roughness:0.4 });

// Textura amb el número pintat sobre el color base
function makeNumberTexture(text, bgHex) {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = bgHex;
  ctx.fillRect(0, 0, 128, 128);
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 4;
  ctx.strokeRect(2, 2, 124, 124);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 88px system-ui';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 64, 68);
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  return tex;
}

function makeNumberMaterial(value, bgHex) {
  return new THREE.MeshStandardMaterial({
    map: makeNumberTexture(String(value), bgHex),
    roughness: 0.5,
  });
}

const cells = []; // { mesh, x, y, z }

const BG_FIXED = '#3a4a80';
const BG_FILLED = '#2d6a55';
const BG_SELECTED = '#c27a25';

const offset = (N-1) * SPACING / 2;
for (let x=0; x<N; x++) {
  for (let y=0; y<N; y++) {
    for (let z=0; z<N; z++) {
      const mesh = new THREE.Mesh(cellGeom, matEmpty.clone());
      mesh.position.set(x*SPACING - offset, y*SPACING - offset, z*SPACING - offset);

      const edges = new THREE.LineSegments(edgeGeom, new THREE.LineBasicMaterial({ color: 0x555a80, transparent:true, opacity:0.5 }));
      mesh.add(edges);

      scene.add(mesh);
      const cell = { mesh, x, y, z };
      cells.push(cell);
      mesh.userData.cell = cell;

      if (fixed[x][y][z]) {
        setCellVisual(cell, grid[x][y][z], true);
      }
    }
  }
}

function setCellVisual(cell, value, isFixed, isSelected = false) {
  const { mesh } = cell;
  // Allibera material/textura anteriors
  const disposeMat = m => {
    if (!m) return;
    if (m.map) m.map.dispose();
    m.dispose();
  };
  if (Array.isArray(mesh.material)) mesh.material.forEach(disposeMat);
  else disposeMat(mesh.material);

  if (value === 0) {
    mesh.material = isSelected
      ? new THREE.MeshStandardMaterial({ color: 0xffb84d, roughness:0.3, emissive:0x553300 })
      : matEmpty.clone();
  } else {
    const bg = isSelected ? BG_SELECTED : (isFixed ? BG_FIXED : BG_FILLED);
    // Mateixa textura amb número a les 6 cares → sempre es veu el número des de qualsevol angle,
    // i el sistema de profunditat oculta els cubs de darrere darrere els de davant.
    const mats = [0,1,2,3,4,5].map(() => makeNumberMaterial(value, bg));
    mesh.material = mats;
  }
}

// Selecció amb raycaster
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let selected = null;
let dragStart = null;

renderer.domElement.addEventListener('pointerdown', e => {
  dragStart = { x: e.clientX, y: e.clientY };
});
renderer.domElement.addEventListener('pointerup', e => {
  if (!dragStart) return;
  const dx = e.clientX - dragStart.x;
  const dy = e.clientY - dragStart.y;
  dragStart = null;
  if (Math.hypot(dx, dy) > 5) return; // era un drag, no clic

  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const meshes = cells.map(c => c.mesh);
  const hits = raycaster.intersectObjects(meshes, false);
  if (hits.length > 0) {
    selectCell(hits[0].object.userData.cell);
  }
});

function selectCell(cell) {
  if (selected) {
    setCellVisual(selected, grid[selected.x][selected.y][selected.z], fixed[selected.x][selected.y][selected.z], false);
  }
  selected = cell;
  setCellVisual(cell, grid[cell.x][cell.y][cell.z], fixed[cell.x][cell.y][cell.z], true);
  document.getElementById('status').textContent =
    `Cel·la: (${cell.x+1}, ${cell.y+1}, ${cell.z+1})` + (fixed[cell.x][cell.y][cell.z] ? ' · fixa' : '');
}

// Botons numèrics
document.querySelectorAll('.num').forEach(btn => {
  btn.addEventListener('click', () => {
    if (!selected) return;
    const {x,y,z} = selected;
    if (fixed[x][y][z]) return;
    const n = parseInt(btn.dataset.n, 10);
    grid[x][y][z] = n;
    setCellVisual(selected, n, false, true);
  });
});

// Eixos guia
const axesHelper = new THREE.AxesHelper(3);
axesHelper.position.set(-offset - 1.2, -offset - 1.2, -offset - 1.2);
scene.add(axesHelper);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function loop() {
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
}
loop();
</script>
</body>
</html>
